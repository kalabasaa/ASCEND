name: Build and Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, zip, exif, pcntl, gd

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Restructure for InfinityFree htdocs layout
        run: |
          mkdir -p deploy

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='deploy' \
            --exclude='public' \
            --exclude='.env' \
            ./ deploy/

          # public/ contents become the web root
          cp -a public/. deploy/

          # index.php now sits one level higher, so drop the "../"
          sed -i "s#__DIR__\.'/\.\./#__DIR__.'/#g" deploy/index.php
          grep -n "__DIR__" deploy/index.php

          # FTP skips empty folders, so give Laravel's writable folders a file
          mkdir -p deploy/storage/framework/{cache/data,sessions,views} deploy/storage/logs deploy/bootstrap/cache
          touch deploy/storage/framework/cache/data/.keep \
                deploy/storage/framework/sessions/.keep \
                deploy/storage/framework/views/.keep \
                deploy/storage/logs/.keep \
                deploy/bootstrap/cache/.keep

          # Block web access to everything that is not public
          cat > deploy/.htaccess.new << 'EOF'
          <FilesMatch "^\.(env|git)">
              Require all denied
          </FilesMatch>
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteRule ^(app|bootstrap|config|database|resources|routes|storage|vendor|tests)(/|$) - [F,L]
              RewriteRule ^(artisan|composer\.json|composer\.lock|package\.json|\.env.*)$ - [F,L]
          </IfModule>
          EOF
          cat deploy/.htaccess >> deploy/.htaccess.new
          mv deploy/.htaccess.new deploy/.htaccess

      - name: Write production .env
        run: |
          cat > deploy/.env << EOF
          APP_NAME=Ascend
          APP_ENV=production
          APP_KEY="${{ secrets.APP_KEY }}"
          APP_DEBUG=false
          APP_URL="${{ secrets.APP_URL }}"

          DB_CONNECTION=mysql
          DB_HOST="${{ secrets.DB_HOST }}"
          DB_PORT=3306
          DB_DATABASE="${{ secrets.DB_DATABASE }}"
          DB_USERNAME="${{ secrets.DB_USERNAME }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          FILESYSTEM_DISK=local

          RECAPTCHA_SITE_KEY="${{ secrets.RECAPTCHA_SITE_KEY }}"
          RECAPTCHA_SECRET_KEY="${{ secrets.RECAPTCHA_SECRET_KEY }}"
          EOF

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            !**/.htaccess